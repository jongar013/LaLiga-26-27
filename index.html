<style>
  :root{
    --paper:#F1ECDD;
    --paper-dark:#E4DCC6;
    --ink:#1E1B16;
    --ink-soft:#5C564A;
    --laliga-red:#C8102E;
    --laliga-red-dark:#970B22;
    --gold:#C79A2E;
    --line:#C9BFA3;
    --card-bg:#FFFDF6;
    --shadow:rgba(30,27,22,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(30,27,22,0.05) 1px, transparent 0) 0 0/14px 14px,
      var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2,h3, .num, .tabbtn, .chip .count, .stat-num{
    font-family:'Oswald',system-ui,sans-serif;
  }

  header{
    background:var(--laliga-red);
    background-image:linear-gradient(160deg, var(--laliga-red) 0%, var(--laliga-red-dark) 100%);
    color:#fff;
    padding:22px 18px 16px;
    border-bottom:6px solid var(--gold);
  }
  header .title-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  header h1{margin:0; font-size:22px; letter-spacing:0.3px; font-weight:700; text-transform:uppercase;}
  header .season{font-size:13px; opacity:0.85; font-weight:500;}
  .progress-wrap{margin-top:14px;}
  .progress-labels{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; opacity:0.92;}
  .progress-bar{height:9px; background:rgba(255,255,255,0.28); border-radius:5px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--gold); border-radius:5px; transition:width .5s ease;}

  .tabs{display:flex; gap:0; margin:16px 18px 0; border-bottom:2px solid var(--line);}
  .tabbtn{
    flex:1; text-align:center; padding:11px 6px 10px; background:none; border:none;
    font-size:14.5px; font-weight:600; letter-spacing:0.3px; text-transform:uppercase;
    color:var(--ink-soft); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .tabbtn.active{color:var(--laliga-red); border-bottom-color:var(--laliga-red);}

  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding:14px 18px; -webkit-overflow-scrolling:touch;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:7px;
    background:var(--card-bg); border:1.5px solid var(--line); border-radius:20px;
    padding:7px 12px 7px 8px; cursor:pointer; white-space:nowrap; font-size:13px; font-weight:600;
    color:var(--ink); transition:border-color .15s, box-shadow .15s;
  }
  .chip .dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto;}
  .chip.active{border-color:var(--laliga-red); box-shadow:0 0 0 1.5px var(--laliga-red) inset;}
  .chip .count{font-size:11.5px; color:var(--ink-soft); font-weight:500;}

  main{padding:6px 18px 30px;}
  .section-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; border-radius:10px 10px 0 0; color:#fff; margin-top:8px;
  }
  .section-head h2{margin:0; font-size:19px; text-transform:uppercase; letter-spacing:0.4px;}
  .section-head .sub{font-size:12.5px; opacity:0.9; margin-top:2px; font-weight:500; font-family:'Inter';}

  .sticker-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px;
    background:var(--paper-dark); padding:14px; border-radius:0 0 10px 10px; border:1px solid var(--line); border-top:none;
  }
  .empty-msg{
    grid-column:1/-1; text-align:center; padding:26px 10px; color:var(--ink-soft); font-size:14px;
  }

  .sticker{
    position:relative; background:var(--card-bg); border-radius:8px; padding:12px 10px 10px;
    cursor:pointer; user-select:none; box-shadow:0 2px 5px var(--shadow);
    border:1px dashed var(--line);
    display:flex; flex-direction:column; gap:6px; min-height:78px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .sticker:active{transform:scale(0.96);}
  .sticker .num{font-size:12px; font-weight:600; color:var(--ink-soft); letter-spacing:0.5px;}
  .sticker .pname{font-size:14px; font-weight:600; line-height:1.28; word-break:break-word;}
  .tag-badge{
    display:inline-block; margin-left:2px; padding:1px 7px; border-radius:9px;
    font-family:'Oswald',system-ui,sans-serif; font-size:10px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.4px; vertical-align:middle; white-space:nowrap;
  }
  .tag-colocas{background:var(--laliga-red); color:#fff;}
  .tag-kromix{background:#8E44AD; color:#fff;}
  .tag-bronce{background:#8C6239; color:#fff;}
  .tag-plata{background:#8E9AAF; color:#1E1B16;}
  .tag-oro{background:var(--gold); color:#1E1B16;}
  .tag-2ed{background:#9C9284; color:#fff;}
  .tag-num{background:#fff; border:1px solid var(--line); color:var(--ink-soft);}
  .sticker.has{opacity:0.5;}

  .stamp{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; transform:scale(1.4) rotate(-14deg);
  }
  .sticker.pop .stamp{
    animation:stampIn .45s ease forwards;
  }
  @keyframes stampIn{
    0%{opacity:0; transform:scale(1.6) rotate(-14deg);}
    55%{opacity:1; transform:scale(0.95) rotate(-14deg);}
    100%{opacity:1; transform:scale(1.05) rotate(-14deg);}
  }
  .stamp span{
    border:3px solid var(--laliga-red); color:var(--laliga-red); font-family:'Oswald';
    font-weight:700; font-size:13px; letter-spacing:1px; text-transform:uppercase;
    padding:3px 8px; border-radius:4px; background:rgba(255,253,246,0.85);
  }

  .collection .sticker .stamp{opacity:1; transform:scale(1) rotate(-10deg);}
  .collection .sticker{cursor:default;}
  .collection .sticker .undo{
    margin-top:auto; align-self:flex-start; font-size:11.5px; background:none; border:none;
    color:var(--laliga-red-dark); font-weight:600; cursor:pointer; padding:0; text-decoration:underline;
  }

  .collection-empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .collection-empty .big{font-size:40px; margin-bottom:8px;}

  /* Pantalla de inicio de sesión */
  #loginScreen{
    position:fixed; inset:0; background:var(--paper); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #loginScreen.hidden{display:none;}
  .hidden{display:none !important;}
  .login-box{width:100%; max-width:340px;}
  .login-box h1{
    font-size:22px; text-transform:uppercase; margin:0 0 4px; color:var(--laliga-red);
  }
  .login-box p.sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 20px;}
  .login-box input{
    width:100%; border:1.5px solid var(--line); border-radius:6px; padding:12px;
    font-size:15px; font-family:'Inter'; margin-bottom:10px; background:#fff; color:var(--ink);
  }
  .login-box .btn-row{display:flex; gap:8px; margin-top:4px;}
  .login-box button{
    flex:1; border:none; border-radius:6px; padding:12px; font-weight:600; font-size:14px; cursor:pointer;
  }
  .login-box .btn-primary{background:var(--laliga-red); color:#fff;}
  .login-box .btn-secondary{background:var(--paper-dark); color:var(--ink);}
  .login-box .login-error{color:var(--laliga-red-dark); font-size:13px; margin-top:10px; min-height:16px;}
  .login-box .login-loading{color:var(--ink-soft); font-size:13px; margin-top:10px;}
  .logout-btn{
    background:rgba(255,255,255,0.22); border:none; color:#fff; padding:5px 11px; border-radius:14px;
    font-size:11.5px; font-weight:600; cursor:pointer;
  }

  @media (max-width:420px){
    header h1{font-size:19px;}
    .sticker-grid{grid-template-columns:repeat(auto-fill, minmax(130px,1fr));}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Álbum LaLiga</h1>
    <p class="sub">Inicia sesión con la cuenta compartida del álbum para ver y marcar los cromos junto a tu amigo, en tiempo real.</p>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password">
    <div class="btn-row">
      <button class="btn-primary" id="loginBtn">Iniciar sesión</button>
      <button class="btn-secondary" id="signupBtn">Crear cuenta</button>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="login-loading" id="loginLoading" style="display:none;">Conectando…</div>
  </div>
</div>

<div id="appRoot" class="hidden">
<header>
  <div class="title-row">
    <h1>Álbum LaLiga</h1>
    <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    <span class="season">Temporada 2026-27 · 2ª edición · Panini</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-labels">
      <span id="progressLabel">0 de 0 cromos</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</header>

<div class="tabs">
  <button class="tabbtn active" data-tab="album">Álbum</button>
  <button class="tabbtn" data-tab="collection">Mi colección</button>
</div>

<div class="chip-row" id="chipRow"></div>

<main id="mainArea"></main>
</div>

function buildBaseName(name, role){
  let out = name;
  if(role) out += ' — ' + role.charAt(0).toUpperCase() + role.slice(1);
  return out;
}

function parseRaw(raw){
  return raw.trim().split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split('|');
    const number = parts[0].trim();
    const name = (parts[1]||'').trim();
    const role = (parts[2]||'').trim();
    const rawTag = (parts[3]||'').trim();
    let tag = '';
    if(number.includes('BIS')) tag = 'COLOCA';
    else if(rawTag === '2') tag = '2ª ed.';
    else if(rawTag) tag = rawTag;
    return { number, name: buildBaseName(name, role), tag };
  });
}

function uid(){
  return 's' + Date.now() + Math.floor(Math.random()*100000);
}

/* Cuando varios cromos de una misma sección comparten nombre (p. ej. la versión
   normal y la Kromix de Draft 23, o Bronce/Plata/Oro de Extra Sticker), si ninguno
   trae ya una etiqueta que los diferencie, se les añade su propio número como
   distintivo para poder identificarlos y, si hace falta, eliminar el que sobre. */
function markDuplicates(stickers){
  const groups = {};
  stickers.forEach(s => {
    const key = s.name.toLowerCase();
    (groups[key] = groups[key] || []).push(s);
  });
  Object.values(groups).forEach(group => {
    if(group.length > 1){
      const anyTagged = group.some(s => s.tag);
      if(!anyTagged){
        group.forEach(s => { s.tag = 'Nº ' + s.number; });
      }
    }
  });
}

const CONMEMORATIVOS_RAW = `

function buildSections(){
  const sections = [];
  const conmemStickers = parseRaw(CONMEMORATIVOS_RAW).map(s => ({ id: uid(), number: s.number, name: s.name, tag: s.tag, obtained:false }));
  sections.push({ id:'conmemorativos', name:'Conmemorativos', type:'special', color:'#7A1F3D', stickers: conmemStickers });
  DEFAULT_TEAMS.forEach((teamName, i) => {
    const raw = TEAMS_RAW[teamName] || '';
    const stickers = parseRaw(raw).map(s => ({ id: uid(), number: s.number, name: s.name, tag: s.tag, obtained:false }));
    markDuplicates(stickers);
    sections.push({ id:'team-'+i, name:teamName, type:'team', color:TEAM_COLORS[teamName], stickers });
  });
  SPECIALS_RAW.forEach((sp, i) => {
    const stickers = parseRaw(sp.raw).map(s => ({ id: uid(), number: s.number, name: s.name, tag: s.tag, obtained:false }));
    markDuplicates(stickers);
    sections.push({ id:'special-'+i, name:sp.name, type:'special', color:sp.color, stickers });
  });
  return sections;
}

let unsubscribeDoc = null;

function docRefFor(uid){
  return db.collection('albums').doc(uid);
}

function save(){
  if(!data || !auth.currentUser || suppressSave) return;
  docRefFor(auth.currentUser.uid).set(data).catch(err => console.error('Error guardando:', err));
}

function startSync(uid){
  if(unsubscribeDoc) unsubscribeDoc();
  unsubscribeDoc = docRefFor(uid).onSnapshot(snap => {
    suppressSave = true;
    if(snap.exists){
      data = snap.data();
    } else {
      const sections = buildSections();
      data = { sections, activeId: sections[0].id };
      docRefFor(uid).set(data);
    }
    if(!activeTab) activeTab = 'album';
    renderAll();
    suppressSave = false;
  }, err => {
    console.error('Error de sincronización:', err);
  });
}

function stopSync(){
  if(unsubscribeDoc){ unsubscribeDoc(); unsubscribeDoc = null; }
  data = null;
}

function showLoginError(msg){
  document.getElementById('loginError').textContent = msg;
}
function setLoginLoading(on){
  document.getElementById('loginLoading').style.display = on ? 'block' : 'none';
}

document.getElementById('loginBtn').onclick = () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  showLoginError('');
  if(!email || !password){ showLoginError('Escribe email y contraseña.'); return; }
  setLoginLoading(true);
  auth.signInWithEmailAndPassword(email, password)
    .catch(err => showLoginError(traducirErrorAuth(err)))
    .finally(() => setLoginLoading(false));
};

document.getElementById('signupBtn').onclick = () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  showLoginError('');
  if(!email || !password){ showLoginError('Escribe email y contraseña.'); return; }

  setLoginLoading(true);
  auth.createUserWithEmailAndPassword(email, password)
    .catch(err => showLoginError(traducirErrorAuth(err)))
    .finally(() => setLoginLoading(false));
};

document.getElementById('logoutBtn').onclick = () => {
  auth.signOut();
};

function traducirErrorAuth(err){
  const map = {
    'auth/invalid-email': 'Ese email no es válido.',
    'auth/user-not-found': 'No existe ninguna cuenta con ese email. Usa "Crear cuenta" la primera vez.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Email o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese email. Usa "Iniciar sesión".',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/network-request-failed': 'Sin conexión a internet.'
  };
  return map[err.code] || 'No se pudo completar la operación. Inténtalo de nuevo.';
}

function getSection(id){

}

function totalCounts(){
  let total = 0, have = 0;
  data.sections.forEach(s => {
    total += s.stickers.length;
    have += s.stickers.filter(st => st.obtained).length;
  });
  return {total, have};
}

function renderHeader(){
  const {total, have} = totalCounts();
  const pct = total ? Math.round((have/total)*100) : 0;
  document.getElementById('progressLabel').textContent = `${have} de ${total} cromos`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  data.sections.forEach(s => {
    const have = s.stickers.filter(st=>st.obtained).length;
    const chip = document.createElement('button');
    chip.className = 'chip' + (s.id === data.activeId ? ' active' : '');
    chip.innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.name} <span class="count">${have}/${s.stickers.length}</span>`;
    chip.onclick = () => { data.activeId = s.id; save(); renderAll(); };
    row.appendChild(chip);
  });
}

const TAG_CLASSES = {
  'COLOCA':'tag-colocas',
  'Kromix':'tag-kromix',
  'Bronce':'tag-bronce',
  'Plata':'tag-plata',
  'Oro':'tag-oro',
  '2ª ed.':'tag-2ed'
};
function tagClass(tag){
  return TAG_CLASSES[tag] || 'tag-num';
}

/* Coloca juntos, uno al lado del otro, los cromos que comparten hueco/numeración
   (p. ej. el Nº1 normal junto a su K1 Kromix, o Lamine Yamal en Bronce/Plata/Oro),
   conservando el orden general para el resto de cromos. */
function groupBySlot(stickers){
  const seen = new Set();
  const ordered = [];
  stickers.forEach(s => {
    const key = s.name.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    stickers.filter(x => x.name.toLowerCase() === key).forEach(x => ordered.push(x));
  });
  return ordered;
}

function stickerCardHTML(section, st, collectionMode){
  const cls = 'sticker' + (st.obtained ? ' has' : '') + (st._justAdded ? ' pop' : '');
  const badge = st.tag ? `<span class="tag-badge ${tagClass(st.tag)}">${escapeHTML(st.tag)}</span>` : '';
  return `
    <div class="${cls}" data-id="${st.id}">
      <div class="num">Nº ${st.number}</div>
      <div class="pname">${escapeHTML(st.name)} ${badge}</div>
      <div class="stamp"><span>Tengo</span></div>
      ${collectionMode ? `<button class="undo" data-undo="${st.id}">Marcar como que falta</button>` : ''}
    </div>`;
}

function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderAlbum(){
  const section = getSection(data.activeId) || data.sections[0];
  const missing = groupBySlot(section.stickers).filter(st => !st.obtained);
  const have = section.stickers.filter(st => st.obtained).length;

  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="section-head" style="background:${section.color}">
      <div>
        <h2>${escapeHTML(section.name)}</h2>
        <div class="sub">${have}/${section.stickers.length} conseguidos</div>
      </div>
    </div>
    <div class="sticker-grid" id="stickerGrid">
      ${missing.length ? missing.map(st => stickerCardHTML(section, st, false)).join('') :
        `<div class="empty-msg">${section.stickers.length ? '¡Los tienes todos de esta sección! 🎉' : 'No hay cromos en esta sección.'}</div>`}
    </div>
  `;

  document.getElementById('stickerGrid').querySelectorAll('.sticker').forEach(card => {
    card.addEventListener('click', (e) => {
      const id = card.dataset.id;
      markObtained(section, id, card);
    });
  });
}

function renderCollection(){
  const main = document.getElementById('mainArea');
  main.className = 'collection';
  const sectionsWithCards = data.sections.filter(s => s.stickers.some(st => st.obtained));

  if(!sectionsWithCards.length){
    main.innerHTML = `<div class="collection-empty"><div class="big">📗</div>Aún no tienes cromos marcados.<br>Ve a "Álbum" y toca un cromo cuando lo consigas.</div>`;
    return;
  }

  main.innerHTML = sectionsWithCards.map(section => {
    const obtained = groupBySlot(section.stickers).filter(st => st.obtained);
    return `
      <div class="section-head" style="background:${section.color}">
        <div>
          <h2>${escapeHTML(section.name)}</h2>
          <div class="sub">${obtained.length} cromo${obtained.length===1?'':'s'}</div>
        </div>
      </div>
      <div class="sticker-grid">
        ${obtained.map(st => stickerCardHTML(section, st, true)).join('')}
      </div>
    `;
  }).join('<div style="height:14px"></div>');

  main.querySelectorAll('[data-undo]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.undo;
      const section = data.sections.find(s => s.stickers.some(st => st.id === id));
      const st = section.stickers.find(s => s.id === id);
      st.obtained = false;
      save();
      renderAll();
    });
  });
}

function markObtained(section, id, cardEl){
  const st = section.stickers.find(s => s.id === id);
  cardEl.classList.add('has','pop');
  cardEl.querySelector('.del')?.remove();
  setTimeout(() => {
    st.obtained = true;
    save();
    renderAll();
  }, 480);
}

document.querySelectorAll('.tabbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b === btn));
    renderAll();
  });
});

function renderAll(){
  if(!data) return;
  renderHeader();
  renderChips();
  const main = document.getElementById('mainArea');
  main.className = '';
  if(activeTab === 'album'){
    renderAlbum();
  } else {
    renderCollection();
  }
}

</script>
</body>
</html>
